name: release

# Builds Sonora for every platform when a GitHub release is published
# and attaches the archives to that release. Android and Linux are built
# with the giode CLI from giode.toml; the macOS and Windows archives with
# go build (which embeds Sonora's own Windows resources from
# cmd/sonora/winres; CLI builds use the CLI's instead).
#
# It also builds the store packages, attached to the same release (see
# RELEASING.md for the secrets and the store setup):
#   msix   - Microsoft Store packages, x64 and ARM64 (Partner Center signs them)
#   dmg    - a universal disk image signed with Developer ID and notarized,
#            when the MACOS_CERT_BASE64 secret is set
#   android - the APK, and the Play bundle (.aab) when the release keystore
#            secrets are set
# The secret names are the ones giode ci's generated workflow uses. There
# is no Mac App Store or iOS job: see RELEASING.md for why.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # The giode CLI version the Android and Linux builds use (it patches Gio
  # so held keys, like backspace, keep repeating on Android).
  GIODE_CLI: v0.1.35-alpha.1

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     goos: linux,   goarch: amd64, native: true }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, native: true }
          - { os: macos-15,         goos: darwin,  goarch: arm64, native: true }
          - { os: macos-15,         goos: darwin,  goarch: amd64, native: false }
          - { os: windows-latest,   goos: windows, goarch: amd64, native: true }
          - { os: windows-latest,   goos: windows, goarch: arm64, native: false }
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev libasound2-dev

      # Gio needs cgo on macOS; clang builds the Intel binary on Apple silicon.
      - name: Configure macOS cross-compiler
        if: matrix.goos == 'darwin' && !matrix.native
        run: |
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CC=clang -arch x86_64" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-arch x86_64 -mmacosx-version-min=11.0" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-arch x86_64 -mmacosx-version-min=11.0" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.native
        run: go test ./...

      - name: Set version
        shell: bash
        run: ./tools/setversion.sh "${VERSION#v}" "${{ github.run_number }}"

      - name: Install the giode CLI
        if: matrix.goos == 'linux'
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@${GIODE_CLI}

      - name: Build (giode CLI)
        if: matrix.goos == 'linux'
        run: giode build -o dist/sonora linux

      - name: Build
        if: matrix.goos != 'linux'
        shell: bash
        run: |
          ldflags="-s -w -X github.com/mehran9675/sonora/ui/pages/settings.Version=${VERSION#v}"
          bin=sonora
          if [ "$GOOS" = windows ]; then
            ldflags="$ldflags -H windowsgui"
            bin=sonora.exe
          fi
          mkdir -p dist
          go build -trimpath -ldflags "$ldflags" -o "dist/$bin" ./cmd/sonora

      - name: Package
        shell: bash
        run: |
          name="sonora-${VERSION}-${GOOS}-${GOARCH}"
          cd dist
          case "$GOOS" in
            windows)
              7z a "../$name.zip" sonora.exe ;;
            darwin)
              app=Sonora.app/Contents
              mkdir -p "$app/MacOS" "$app/Resources"
              mv sonora "$app/MacOS/Sonora"
              # Build AppIcon.icns from the 1024px icon.
              iconset=AppIcon.iconset
              mkdir -p "$iconset"
              src=../assets/icon/icon-macos.png
              for s in 16 32 128 256 512; do
                sips -z $s $s "$src" --out "$iconset/icon_${s}x${s}.png" >/dev/null
                sips -z $((s*2)) $((s*2)) "$src" --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns "$iconset" -o "$app/Resources/AppIcon.icns"
              rm -rf "$iconset"
              cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Sonora</string>
            <key>CFBundleDisplayName</key><string>Sonora</string>
            <key>CFBundleIdentifier</key><string>com.sonora.app</string>
            <key>CFBundleExecutable</key><string>Sonora</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Sonora records a sample of your voice when you choose to clone it.</string>
          </dict></plist>
          PLIST
              # Seal the bundle with an ad-hoc signature. Without it,
              # macOS reports a downloaded copy as "damaged".
              codesign --force --deep --sign - Sonora.app
              codesign --verify --deep --strict --verbose=2 Sonora.app
              ditto -c -k --keepParent Sonora.app "../$name.zip" ;;
            *)
              # The executable, its .desktop entry and icon, from giode.
              tar -czf "../$name.tar.gz" sonora com.sonora.app.desktop com.sonora.app.png ;;
          esac

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" sonora-${VERSION}-${GOOS}-${GOARCH}.* --clobber

  android:
    name: android (arm64, arm, amd64)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.release.tag_name }}
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship the Android SDK in $ANDROID_HOME;
      # its sdkmanager adds the exact versions this build uses.
      - name: Install Android platform and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          ls "$ANDROID_HOME/ndk/${NDK_VERSION}" >/dev/null

      # Sign with the release keystore in the ANDROID_KEYSTORE_BASE64
      # secret (base64), password in GIODE_KEYSTORE_PASS, so updates install
      # over older versions and Google Play accepts the bundle (the older
      # ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD names still work).
      # Without it the APK is signed with a throwaway key and no bundle is
      # attached. giode.toml's android.keystore points at release.keystore.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.GIODE_KEYSTORE_PASS || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.keystore
            pass="$KEYSTORE_PASS"
            echo "PLAY_BUNDLE=1" >> "$GITHUB_ENV"
          else
            pass="throwaway-$RANDOM$RANDOM"
            keytool -genkey -keystore release.keystore -storepass "$pass" -alias sonora \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt -dname CN=Sonora
          fi
          echo "::add-mask::$pass"
          echo "GIODE_KEYSTORE_PASS=$pass" >> "$GITHUB_ENV"

      # sherpa-onnx runs the on-device engines. fetchsherpa also writes
      # third_party/sherpa-onnx/android.aar, which giode.toml's
      # android.libraries packs into the APK and the bundle.
      - name: Download sherpa-onnx
        run: go run ./tools/fetchsherpa android

      - name: Install the giode CLI
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@${GIODE_CLI}

      # giode adds the manifest entries in giode.toml (microphone,
      # notifications, the KeepAlive service) and signs with the keystore.
      - name: Build APK and bundle
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./tools/setversion.sh "${VERSION#v}" "${{ github.run_number }}"
          giode build -release android aab
          cp dist/android/Sonora.apk "sonora-${VERSION}-android.apk"
          if [ -n "$PLAY_BUNDLE" ]; then
            cp dist/android/*.aab "sonora-${VERSION}-android.aab"
          fi

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" sonora-${VERSION}-android.* --clobber

  msix:
    name: Microsoft Store (x64, ARM64)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the giode CLI
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@${GIODE_CLI}

      # Unsigned: Partner Center signs Store packages. The identity comes
      # from giode.toml's [windows.msix].
      - name: Build MSIX
        run: |
          ./tools/setversion.sh "${VERSION#v}" "${{ github.run_number }}"
          giode build -arch amd64 msix
          giode build -arch arm64 msix
          for arch in amd64 arm64; do
            cp dist/windows/Sonora-*-$arch.msix "sonora-${VERSION}-windows-$arch.msix"
          done

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" sonora-${VERSION}-windows-*.msix --clobber

  dmg:
    name: macOS disk image (signed, notarized)
    runs-on: macos-15
    # A hung signing or notarizing step fails in an hour rather than six.
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name }}
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        if: env.MACOS_CERT_BASE64 != ''

      - uses: actions/setup-go@v5
        if: env.MACOS_CERT_BASE64 != ''
        with:
          go-version-file: go.mod

      - name: Install the giode CLI
        if: env.MACOS_CERT_BASE64 != ''
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@${GIODE_CLI}

      # The "Developer ID Application" certificate (.p12).
      - name: Signing certificate
        if: env.MACOS_CERT_BASE64 != ''
        env:
          MACOS_CERT_PASS: ${{ secrets.MACOS_CERT_PASS }}
        run: |
          echo "$MACOS_CERT_BASE64" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      # Signed with the certificate's Developer ID identity and notarized
      # with the Apple ID, team and app-specific password below, so
      # Gatekeeper opens it once downloaded.
      - name: Build
        if: env.MACOS_CERT_BASE64 != ''
        env:
          GIODE_NOTARY_ID: ${{ secrets.GIODE_NOTARY_ID }}
          GIODE_NOTARY_TEAM_ID: ${{ secrets.GIODE_NOTARY_TEAM_ID }}
          GIODE_NOTARY_PASS: ${{ secrets.GIODE_NOTARY_PASS }}
        run: |
          ./tools/setversion.sh "${VERSION#v}" "${{ github.run_number }}"
          giode build -release dmg
          cp dist/macos/*.dmg "sonora-${VERSION}-macos-universal.dmg"

      - name: Attach to release
        if: env.MACOS_CERT_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "sonora-${VERSION}-macos-universal.dmg" --clobber
