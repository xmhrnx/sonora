name: release

# Builds Sonora for every platform when a GitHub release is published
# and attaches the archives to that release. Android and Linux are built
# with the giode CLI from giode.toml; macOS and Windows with go build
# (Windows keeps the resources in cmd/sonora/winres, whose manifest the
# CLI's would clash with).
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # The giode CLI version the Android and Linux builds use (it patches Gio
  # so held keys, like backspace, keep repeating on Android).
  GIODE_CLI: v0.1.11-alpha.1

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     goos: linux,   goarch: amd64, native: true }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, native: true }
          - { os: macos-15,         goos: darwin,  goarch: arm64, native: true }
          - { os: macos-15,         goos: darwin,  goarch: amd64, native: false }
          - { os: windows-latest,   goos: windows, goarch: amd64, native: true }
          - { os: windows-latest,   goos: windows, goarch: arm64, native: false }
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev libasound2-dev

      # Gio needs cgo on macOS; clang builds the Intel binary on Apple silicon.
      - name: Configure macOS cross-compiler
        if: matrix.goos == 'darwin' && !matrix.native
        run: |
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CC=clang -arch x86_64" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-arch x86_64 -mmacosx-version-min=11.0" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-arch x86_64 -mmacosx-version-min=11.0" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.native
        run: go test ./...

      - name: Set version
        shell: bash
        run: ./tools/setversion.sh "${VERSION#v}" "${{ github.run_number }}"

      - name: Install the giode CLI
        if: matrix.goos == 'linux'
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@${GIODE_CLI}

      - name: Build (giode CLI)
        if: matrix.goos == 'linux'
        run: giode build -o dist/sonora linux

      - name: Build
        if: matrix.goos != 'linux'
        shell: bash
        run: |
          ldflags="-s -w -X github.com/mehran9675/sonora/ui/pages/settings.Version=${VERSION#v}"
          bin=sonora
          if [ "$GOOS" = windows ]; then
            ldflags="$ldflags -H windowsgui"
            bin=sonora.exe
          fi
          mkdir -p dist
          go build -trimpath -ldflags "$ldflags" -o "dist/$bin" ./cmd/sonora

      - name: Package
        shell: bash
        run: |
          name="sonora-${VERSION}-${GOOS}-${GOARCH}"
          cd dist
          case "$GOOS" in
            windows)
              7z a "../$name.zip" sonora.exe ;;
            darwin)
              app=Sonora.app/Contents
              mkdir -p "$app/MacOS" "$app/Resources"
              mv sonora "$app/MacOS/Sonora"
              # Build AppIcon.icns from the 1024px icon.
              iconset=AppIcon.iconset
              mkdir -p "$iconset"
              src=../assets/icon/icon-macos.png
              for s in 16 32 128 256 512; do
                sips -z $s $s "$src" --out "$iconset/icon_${s}x${s}.png" >/dev/null
                sips -z $((s*2)) $((s*2)) "$src" --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns "$iconset" -o "$app/Resources/AppIcon.icns"
              rm -rf "$iconset"
              cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Sonora</string>
            <key>CFBundleDisplayName</key><string>Sonora</string>
            <key>CFBundleIdentifier</key><string>com.sonora.app</string>
            <key>CFBundleExecutable</key><string>Sonora</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Sonora records a sample of your voice when you choose to clone it.</string>
          </dict></plist>
          PLIST
              # Seal the bundle with an ad-hoc signature. Without it,
              # macOS reports a downloaded copy as "damaged".
              codesign --force --deep --sign - Sonora.app
              codesign --verify --deep --strict --verbose=2 Sonora.app
              ditto -c -k --keepParent Sonora.app "../$name.zip" ;;
            *)
              # The executable, its .desktop entry and icon, from giode.
              tar -czf "../$name.tar.gz" sonora com.sonora.app.desktop com.sonora.app.png ;;
          esac

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" sonora-${VERSION}-${GOOS}-${GOARCH}.* --clobber

  android:
    name: android (arm64, arm, amd64)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.release.tag_name }}
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship the Android SDK in $ANDROID_HOME;
      # its sdkmanager adds the exact versions this build uses.
      - name: Install Android platform and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          ls "$ANDROID_HOME/ndk/${NDK_VERSION}" >/dev/null

      # Sign with the keystore in the ANDROID_KEYSTORE secret (base64)
      # when one is configured, so updates install over older versions.
      # Without it the build is signed with a throwaway key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/sonora.keystore"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$key"
            pass="$KEYSTORE_PASS"
          else
            pass="throwaway-$RANDOM$RANDOM"
            keytool -genkey -keystore "$key" -storepass "$pass" -alias sonora \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt -dname CN=Sonora
          fi
          echo "::add-mask::$pass"
          echo "SIGN_KEY=$key" >> "$GITHUB_ENV"
          echo "GOGIO_SIGNPASS=$pass" >> "$GITHUB_ENV"

      # sherpa-onnx runs the on-device engines.
      - name: Download sherpa-onnx
        run: go run ./tools/fetchsherpa android

      - name: Install the giode CLI
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@${GIODE_CLI}

      # giode adds the manifest entries in giode.toml (microphone,
      # notifications, the KeepAlive service) and signs with the debug key.
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./tools/setversion.sh "${VERSION#v}" "${{ github.run_number }}"
          giode build android

      # giode packs only libgio.so; add the sherpa-onnx libraries it links
      # against, then align and sign with the release key.
      - name: Add native libraries and sign
        run: |
          go run ./tools/packapk -ks "$SIGN_KEY" -pass-env GOGIO_SIGNPASS \
            -o "sonora-${VERSION}-android.apk" dist/android/Sonora.apk

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "sonora-${VERSION}-android.apk" --clobber
